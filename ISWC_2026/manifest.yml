- section: ShEx
  examples:               
     - comment: 'RDF with errors'
       dataLabel: Example with errors
       dataURL: ex10_rdf_with_errors.ttl
       dataFormat: turtle
       action: data
     - schemaLabel: Researcher
       schemaURL: ex11_researcher.shex
       dataLabel: Tim Berners Lee
       dataURL: ex11_timbl.ttl
       queryMapURL: ex11.sm 
       status: conformant
       comment: 'Basic example of Tim Berners-Lee as a researcher'
       action: validate
     - comment: 'ShEx: Person exercise'
       schemaLabel: Person
       schemaURL: ex12.shex
       dataLabel: Several values
       dataURL: ex12.ttl
       queryMapURL: ex12.sm 
       status: nonconformant
       action: validate  
     - comment: 'Basic validation'
       schemaLabel: Person
       schemaURL: ShEx/two_nodes_person.shex
       dataLabel: a and b
       dataURL: ShEx/two_nodes.ttl
       queryMapURL: ShEx/two_nodes.map 
       status: conformant
       action: validate  
     - comment: 'Node Constraints'
       schemaLabel: Book
       schemaURL: ShEx/node_constraints.shex
       dataLabel: item23
       dataURL: ShEx/node_constraints.ttl
       queryMapURL: ShEx/node_constraints.sm
       status: conformant
       action: validate  
     - comment: 'Cardinalities'
       schemaLabel: Book
       schemaURL: ShEx/cardinalities.shex
       dataLabel: item23
       dataURL: ShEx/cardinalities.ttl
       queryMapURL: ShEx/cardinalities.sm 
       status: conformant
       action: validate  
     - comment: 'Cyclic data models'
       schemaLabel: Book
       schemaURL: ShEx/recursion.shex
       dataLabel: item23
       dataURL: ShEx/recursion.ttl
       queryMapURL: ShEx/recursion.sm
       status: conformant
       action: validate  
     - comment: 'Open/Closed shapes'
       schemaLabel: Book1 and Book2
       schemaURL: ShEx/book_open_closed.shex
       dataLabel: item23
       dataURL: ShEx/book_open_closed.ttl
       queryMapURL: ShEx/book_open_closed.sm
       status: conformant
       action: validate  
     - comment: 'Open/Closed properties'
       schemaLabel: Book1, Book2 and Book3
       schemaURL: ShEx/open_closed_properties.shex
       dataLabel: item23, item24, item25 and item 26
       dataURL: ShEx/open_closed_properties.ttl
       queryMapURL: ShEx/open_closed_properties.sm
       status: nonconformant
       action: validate  
     - comment: 'Triple expressions'
       schemaLabel: Person
       schemaURL: ShEx/triple_exprs.shex
       dataLabel: alice, bob, dave and carol
       dataURL: ShEx/triple_exprs.ttl
       queryMapURL: ShEx/triple_exprs.sm
       status: nonconformant
       action: validate  
     - comment: 'Logical operators'
       schemaLabel: Book and AudioBook
       schemaURL: ShEx/logical.shex
       dataLabel: item23 and item24
       dataURL: ShEx/logical.ttl
       queryMapURL: ShEx/logical.sm
       status: nonconformant
       action: validate  
     - comment: 'Importing schemas'
       schemaLabel: Book and AudioBook
       schemaURL: ShEx/import.shex
       dataLabel: item24
       dataURL: ShEx/import.ttl
       queryMapURL: ShEx/import.sm
       status: conformant
       action: validate  
     # Shape maps
     - comment: 'ShapeMap: instance of :Person'
       schemaLabel: Person
       schemaURL: ex12.shex
       dataLabel: Several values
       dataURL: ex13_persons.ttl
       queryMap: |
         {FOCUS a :Person}@:Person
       status: nonconformant
       action: validate
     - comment: 'ShapeMap: has property :name'
       schemaLabel: Person
       schemaURL: ex12.shex
       dataLabel: Several values
       dataURL: ex13_persons.ttl
       queryMap: |
         {FOCUS a _}@:Person
       status: nonconformant
       action: validate
     - comment: 'ShapeMap: SPARQL query'
       schemaLabel: Person
       schemaURL: ex12.shex
       dataLabel: Several values
       dataURL: ex13_persons.ttl
       queryMap: |
        SPARQL """
        PREFIX : <http://example.org/>
        SELECT ?person WHERE {
          ?person :name  ?name;
                  :knows :a
        }"""@:Person
       status: nonconformant
       action: validate
     - comment: 'Inheritance'
       schemaLabel: Book
       schemaURL: ex13_inheritance.shex
       dataLabel: Item
       dataURL: ex13_inheritance.ttl
       queryMapURL: ex13_inheritance.sm 
       status: conformant
       action: validate    
     - comment: 'Different syntaxes'
       schemaLabel: Researcher
       schemaURL: ex11_researcher.shex
       schemaFormat: shex
       action: schema
