# Examples for ISWC 2026 tutorial
- section: Knowledge Graphs
  comment: Examples about Knowledge Graphs
  examples: 
     - comment: 'Tim Berners-Lee in RDF (Turtle)'
       dataLabel: example 01
       dataURL: ex01.ttl
       dataFormat: turtle
       action: data
     - comment: 'RDF and SPARQL (Tim Berners Lee)'
       dataLabel: Tim Berners Lee
       dataURL: ex01.ttl
       dataFormat: turtle
       queryURL: ex01.sparql
       queryEngine: sparql
       action: query
     - comment: 'Wikidata and SPARQL'
       endpoint: wikidata
       queryURL: wikidata.sparql
       queryEngine: sparql
       action: query
     - comment: 'Property graph (Tim Berners Lee)'
       dataLabel: Tim Berners
       dataURL: ex02.pg
       dataFormat: yars-pg
       action: data
     - section: 'Wikidata & Wikibase'
       examples: 
           # Example 4: wikidata query
           - comment: 'Wikidata SPARQL query'  
             endpoint: https://query.wikidata.org/sparql
             queryURL: ex04_wikidata.sparql
             queryEngine: sparql
             action: query
     - section: 'RDF 1.2'
       examples:
           # Example 5 RDF 1.2 annotated triples
           - comment: 'RDF 1.2 (annotated triples)'
             dataLabel: Tim Berners Lee 
             dataURL: ex05_annotated.ttl
             dataFormat: turtle
             action: data
           - comment: 'RDF 1.2 (reifies)'
             dataLabel: Tim Berners Lee in RDF 1.2 with reifies
             dataURL: ex05_with_reifies.ttl
             dataFormat: turtle
             action: data
           - comment: 'RDF and SPARQL 1.2 annotated syntax'
             dataLabel: Tim Berners Lee in RDF 1.2 annotated triples
             dataURL: ex05_annotated.ttl
             dataFormat: turtle
             queryURL: ex05_sparql.sparql
             action: query
           - comment: 'RDF and SPARQL 1.2 with reifies'
             dataLabel: Tim Berners Lee
             dataURL: ex05_with_reifies.ttl
             dataFormat: turtle
             queryURL: ex05_sparql.sparql
             action: query
           - comment: 'RDF 1.2 (non-asserted)'
             dataLabel: Tim Berners Lee in RDF 1.2 non asserted
             dataURL: ex06_rdf12_non_asserted.ttl
             dataFormat: turtle
             action: data
           - comment: 'RDF 1.2 (non-asserted with reifies)'
             dataLabel: RDF 1.2 non asserted with reifies
             dataURL: ex06_rdf12_with_reifies.ttl
             dataFormat: turtle
             action: data
           - comment: 'RDF 1.2 (Tim Berners-Lee)'
             dataLabel: Tim Berners Lee in RDF 1.2
             dataURL: ex07_timbl_rdf12.ttl
             dataFormat: turtle
             action: data
           - comment: 'RDF 1.2 (Tim Berners-Lee nested)'
             dataLabel: Tim Berners Lee in RDF 1.2 
             dataURL: ex08_rdf12_nested.ttl
             dataFormat: turtle
             action: data
